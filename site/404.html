<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Seite umgezogen – RENT US Glanzgarage</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:#12180f; color:#eef1e8;
         text-align:center; padding:2rem; }
  .box { max-width:520px; }
  h1 { font-size:2rem; margin:0 0 .5rem; }
  p { color:#b9c2ad; line-height:1.6; }
  .links { display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:1.5rem; }
  a.btn { display:inline-block; padding:.7rem 1.2rem; border-radius:999px; text-decoration:none;
          background:#a8c64a; color:#14200a; font-weight:600; }
  a.ghost { background:transparent; color:#a8c64a; border:1px solid #4a5a2e; }
  .small { font-size:.85rem; color:#8a9578; margin-top:1.4rem; }
</style>
<script>
  // Alte Baukasten-URLs auf die neuen Ziele umleiten (Auffangnetz zusätzlich zu den Stub-Seiten)
  (function () {
    var map = {
      "pakete-im-ueberblick": "/#pakete",
      "pakete": "/#pakete",
      "abo-s": "/#abos",
      "abos": "/#abos",
      "kontakt": "/#kontakt",
      "impressum": "/impressum.html",
      "datenschutz": "/datenschutz.html",
      "ueber-uns": "/#ueber-uns",
      "leistungen": "/#pakete",
      "versiegelung": "/#versiegelung",
      "faq": "/#faq"
    };
    var slug = location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
    if (map[slug]) { location.replace(map[slug]); }
  })();
</script>
</head>
<body>
  <div class="box">
    <h1>Diese Seite ist umgezogen 🐾</h1>
    <p>Unsere Website wurde erneuert. Die Seite, die du gesucht hast, gibt es unter einer neuen Adresse –
       schau einfach direkt vorbei:</p>
    <div class="links">
      <a class="btn" href="/">Zur Startseite</a>
      <a class="ghost btn" href="/#pakete">Pakete</a>
      <a class="ghost btn" href="/#abos">Abos</a>
      <a class="ghost btn" href="/#kontakt">Kontakt</a>
    </div>
    <p class="small">RENT US Glanzgarage · Fahrzeugaufbereitung · Würzburg · Wertheim · Marktheidenfeld</p>
  </div>
</body>
</html>
